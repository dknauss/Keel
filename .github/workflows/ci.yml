name: CI

# Lint and the unit suite, on every pull request and every push to main.
#
# release.yml already runs these — but only when a version tag is pushed, which
# is the last possible moment to discover a failure and the worst one. A test
# that first runs at release is a test that has already shipped.
#
# Two jobs, deliberately separate.
#
# `test` answers "did this change break anything" on one PHP version, with the
# linter and the full suite. `compat` answers "does it still run on the floor we
# claim", across versions, with no linter and no dependencies. Folding them
# together would mean either running phpcs six times for no reason, or letting
# a coding-standards failure read as a compatibility failure — and a green tick
# that means two different things means neither.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Syntax check every PHP file
        run: bash bin/lint-syntax.sh

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Coding standards
        run: composer lint

      # Separate step, not folded into `composer lint`, for the reason given at
      # the top of this file: this one answers "does it still run on the floor we
      # advertise", and a style failure and a floor failure should not share a
      # tick.
      #
      # It runs here rather than in the `compat` matrix below because it is static
      # analysis with an explicit testVersion — it reads the same answer on any
      # interpreter, so running it seven times would cost six extra minutes to
      # learn nothing. What it catches is what the matrix cannot: `php -l` on 7.4
      # accepts a PHP 8 only function call, and the suite only executes part of
      # the plugin.
      - name: PHP compatibility floor
        run: composer lint:compat

      # Enumerated, not listed: a hand-maintained list of test files silently
      # stops running the one somebody adds next. That is not hypothetical —
      # tests/readme-spec.php sat outside `composer test` from the moment it
      # was merged.
      - name: Unit tests
        run: composer test

  compat:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      # Every version reports. A failure on the floor and a failure on the
      # newest release are different problems and you want to see both.
      fail-fast: false
      matrix:
        # The floor is what keel.php, composer.json and readme.txt all claim, so
        # it is tested rather than asserted. The rest are every release still
        # receiving security support, plus the current one — which hosts offer
        # well before it is the default, so it belongs here rather than in a
        # later catch-up.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # mbstring: the password length rule counts characters with mb_strlen,
          # because strlen() reads eight emoji as 32 and would wave through a
          # password far shorter than the rule intends.
          extensions: mbstring
          coverage: none

      # No composer install, deliberately.
      #
      # The plugin has no runtime dependencies and the suite has no autoloader —
      # each test is a standalone file that stubs the WordPress functions it
      # needs. Installing dev tooling here would test whether phpcs supports PHP
      # 7.4, which is not the question, and would fail for reasons that have
      # nothing to do with the plugin. bin/lint-syntax.sh is bash and php and
      # nothing else, so sharing it with the `test` job above does not put a
      # dependency back.
      - name: Syntax check on this version
        run: bash bin/lint-syntax.sh

      # The same enumeration `composer test` uses, inlined so this job needs no
      # composer at all.
      - name: Unit tests on this version
        run: |
          set -e
          for f in tests/*.php; do php "$f" || exit 1; done

  # Rebuild the zip the Playground demo installs, on every push to main.
  #
  # The `latest` release asset used to be written only by release.yml, which fires
  # on version tags — so "the rolling latest build" was really "the last tagged
  # release", and the hosted blueprint served the same zip as the stable one. Work
  # that had merged to main was invisible in the demo, which is the one place a
  # reviewer looks to see what the plugin currently does.
  #
  # Gated to pushes on main so a pull request never republishes the demo; the fork
  # case is covered by the same condition, since a fork's push does not run here.
  rolling:
    name: Republish the rolling build
    needs: [ test, compat ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: bash bin/build-zip.sh build

      - name: Upload to the rolling 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES="Rolling build of main (${GITHUB_SHA:0:7}). Not a release — see the tagged releases for those."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest build/keel.zip --clobber
            gh release edit latest --notes "$NOTES" --prerelease >/dev/null
          else
            gh release create latest build/keel.zip \
              --title "Latest build (rolling)" --prerelease --notes "$NOTES"
          fi
