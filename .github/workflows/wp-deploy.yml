name: Deploy to WordPress.org

# TRIGGERS — read this before adding a third one.
#
# There is deliberately NO `release: types: [published]` trigger, even though it
# looks like the obvious one. release.yml publishes the GitHub Release using the
# default GITHUB_TOKEN, and GitHub does not start workflow runs from events that
# token generates. That trigger would never fire — silently, with every other
# signal (tag, Release, green CI) saying the release shipped while wordpress.org
# stayed on the previous version.
#
# This is not theoretical. The sibling Maestro repo carried exactly that trigger
# for six releases; it fired zero times, every deploy was run by hand, and the
# repeated manual step got written down as a discipline lesson for four releases
# before anyone checked the run history.
#
# So release.yml CALLS this workflow directly as a dependent job. workflow_dispatch
# stays for re-deploys and recovery.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v0.6.0). Leave blank to use the ref this was dispatched from."
        required: false
        default: ""
      dry_run:
        description: "Rehearse everything except the commit. Does NOT test the SVN credential — only a commit does."
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: "Release tag to deploy, passed by release.yml."
        required: true
        type: string
    secrets:
      SVN_USERNAME:
        required: false
      SVN_PASSWORD:
        required: false
      WP_ORG_SVN_USERNAME:
        required: false
      WP_ORG_SVN_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  # `inputs` covers BOTH workflow_dispatch and workflow_call; `github.event.inputs`
  # is null on a call and would collapse every release into one group.
  group: wporg-deploy-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to WordPress.org SVN
    runs-on: ubuntu-latest

    # THE HUMAN GATE. Everything before this is automatic; this job STOPS and
    # waits for an approval on the `wordpress-org` environment before anything
    # reaches wordpress.org.
    #
    # ⚠️ The gate is only real if the environment EXISTS with a required reviewer.
    # GitHub AUTO-CREATES a missing environment WITH NO PROTECTION RULES and the
    # job sails straight through — no error, it just stops asking. Create it
    # before the first tag, and if deploys ever stop prompting, check this first.
    environment: wordpress-org

    steps:
      - name: Resolve ref + version
        id: meta
        env:
          # Bound to env vars rather than interpolated into the script body, so
          # no dispatch input can break out of the string and inject shell.
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          REF="$INPUT_TAG"
          [ -z "$REF" ] && REF="$REF_NAME"

          # Only a plain vX.Y.Z tag is deployable. This does two jobs:
          #
          #  1. rejects a malformed value and closes arbitrary-branch/SHA checkout
          #     through the manual dispatch, and
          #  2. REFUSES PRE-RELEASES. release.yml deliberately tags -dev/-alpha/
          #     -beta/-rc and marks those as GitHub pre-releases. wordpress.org has
          #     no equivalent concept: pushing one would set it as the stable
          #     version every user updates to. The regex has no prerelease branch,
          #     so those tags stop here rather than shipping a beta to everyone.
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to deploy '$REF' — wordpress.org takes stable vX.Y.Z tags only (pre-releases are GitHub-only)."
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      # Credentials are resolved before the checkout and the build. Both deploys
      # this workflow has ever attempted spent a minute assembling a package and
      # then died on the credential; failing in six seconds says the same thing.
      - name: Normalize SVN credentials
        id: svn-creds
        env:
          RAW_SVN_USERNAME: ${{ secrets.SVN_USERNAME != '' && secrets.SVN_USERNAME || secrets.WP_ORG_SVN_USERNAME }}
          RAW_SVN_PASSWORD: ${{ secrets.SVN_PASSWORD != '' && secrets.SVN_PASSWORD || secrets.WP_ORG_SVN_PASSWORD }}
        run: |
          SVN_USERNAME="$(printf '%s' "$RAW_SVN_USERNAME" | tr -d '\r\n')"
          SVN_PASSWORD="$(printf '%s' "$RAW_SVN_PASSWORD" | tr -d '\r\n')"

          test -n "$SVN_USERNAME"
          test -n "$SVN_PASSWORD"

          echo "::add-mask::$SVN_USERNAME"
          echo "::add-mask::$SVN_PASSWORD"

          printf 'svn_username=%s\n' "$SVN_USERNAME" >> "$GITHUB_OUTPUT"
          printf 'svn_password=%s\n' "$SVN_PASSWORD" >> "$GITHUB_OUTPUT"

      # What this can and cannot tell you, stated plainly because the gap is the
      # whole point: wordpress.org serves SVN reads anonymously, so no command
      # short of a commit makes the server check a password. Nothing here proves
      # the credential works. What it does check is the mistake that actually
      # produces svn E215004 in practice — the wrong identity in the username.
      #
      # The directory publishes who is listed on the plugin, so the username can
      # be compared against it for nothing. Listed contributors are not exactly
      # the set of SVN committers, which is why a mismatch warns rather than
      # fails: blocking a real release on an inexact signal is worse than the
      # thing it prevents. An email address is not an inexact signal — the
      # wordpress.org login is never an email — so that one fails.
      - name: Preflight the SVN identity
        env:
          SVN_USERNAME: ${{ steps.svn-creds.outputs.svn_username }}
          SLUG: keel-defaults
        run: |
          set -uo pipefail

          case "$SVN_USERNAME" in
            *@*)
              echo "::error::The SVN username is an email address. wordpress.org SVN wants the account login — the name in profiles.wordpress.org/<login>/ — never the address it was registered with."
              exit 1
              ;;
          esac

          LISTED="$(
            curl -sS --globoff -m 20 "https://api.wordpress.org/plugins/info/1.2/?action=plugin_information&request[slug]=${SLUG}" \
              | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin).get("contributors", {})))'
          )" || LISTED=""

          if [ -z "$LISTED" ]; then
            echo "::warning::Could not read the contributor list from the plugin directory, so the username went unchecked. Not a reason to stop a deploy."
            exit 0
          fi

          for name in $LISTED; do
            if [ "$name" = "$SVN_USERNAME" ]; then
              echo "SVN username matches a contributor listed on the plugin."
              exit 0
            fi
          done

          echo "::warning::The SVN username is not among the contributors wordpress.org lists for ${SLUG} (${LISTED}). That is the usual cause of svn E215004: the GitHub login and the wordpress.org login are easy to swap, and for this plugin they differ. If the account is a committer without being a listed contributor, ignore this."


      # Whether the deploy will actually deploy anything.
      #
      # The action bails the moment it finds tags/$VERSION already in SVN — one
      # line, exit 0, before the rsync into trunk, before `svn add`, before the
      # tag copy. That is correct behaviour and the right protection against
      # republishing a shipped version. What it is not is visible: the job goes
      # green having exercised the checkout and nothing after it, which reads
      # exactly like a full run.
      #
      # That is not hypothetical. The first dry run of this workflow, against
      # 0.5.9, was read as proof the pipeline worked end to end. It had stopped
      # at the first step and proved almost nothing.
      #
      # So the short-circuit is announced before it happens. A dry run of a
      # published version is not a rehearsal and must not be reported as one.
      - name: Will this deploy anything?
        id: published
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          SLUG: keel-defaults
        run: |
          set -uo pipefail

          # -f so an HTTP error is an empty body rather than a 404 page, which
          # would otherwise read as "this version is not published yet" and send
          # the run off believing the opposite of what is true.
          LISTING="$( curl -sSf --globoff -m 20 "https://plugins.svn.wordpress.org/${SLUG}/tags/" )" || LISTING=""

          if [ -z "$LISTING" ]; then
            echo "::warning::Could not read the SVN tag list, so whether ${VERSION} is already published is unknown. Everything below runs as normal; just do not read a green run as proof the deploy path was exercised."
            echo "state=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s' "$LISTING" | grep -qE "href=\"${VERSION//./\\.}/\""; then
            echo "state=published" >> "$GITHUB_OUTPUT"
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::${VERSION} is already in SVN, so this rehearsal proves very little. The deploy action stops as soon as it sees tags/${VERSION}: it will check out the .org repository and exit before the copy into trunk, the svn add, and the tag copy. To rehearse those, dry-run a version that has not shipped."
              {
                echo "### Dry run of an already-published version"
                echo
                echo "\`${VERSION}\` is already in SVN. The deploy action exits at the checkout, so **the copy into trunk, \`svn add\`, the tag copy and the commit were not exercised.** A green run here is not evidence the deploy path works."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::${VERSION} is already in SVN. The deploy action will exit without committing, so this run will change nothing on wordpress.org. That makes re-running a failed deploy safe, but if you expected this to publish something, the version number is wrong."
            fi
            exit 0
          fi

          echo "state=new" >> "$GITHUB_OUTPUT"
          echo "${VERSION} is not yet in SVN; the deploy path will run in full."

      - name: Checkout ${{ steps.meta.outputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - name: Verify deploy version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          HEADER_VERSION="$(grep -m1 -E '^\s*\*\s*Version:' keel.php | sed -E 's/.*Version:[[:space:]]*//')"
          STABLE_TAG="$(grep -m1 -E '^Stable tag:' readme.txt | sed -E 's/^Stable tag:[[:space:]]*//')"
          echo "tag=$VERSION  header=$HEADER_VERSION  stable=$STABLE_TAG"
          test "$VERSION" = "$HEADER_VERSION"
          test "$VERSION" = "$STABLE_TAG"

      # Same builder both other workflows use, so what deploys is what ships.
      # Produces build/keel-defaults/ (the tree) and build/keel.zip.
      - name: Build runtime tree
        run: bash bin/build-zip.sh build

      # .wordpress-org holds the directory-page assets AND working material that
      # must not be published: blueprints/ and brand/ are sources, and
      # .screenshots-reviewed is a local bookkeeping marker. Everything left in
      # this folder is uploaded verbatim to the plugin's public assets directory,
      # so the excludes are load-bearing, not tidiness.
      - name: Stage WordPress.org assets
        run: |
          mkdir -p build/wporg-assets
          rsync -a .wordpress-org/ build/wporg-assets/ \
            --exclude '.DS_Store' \
            --exclude '.screenshots-reviewed' \
            --exclude 'blueprints/' \
            --exclude 'brand/'
          echo "== staged assets =="
          ls -1 build/wporg-assets

      - name: WordPress.org plugin deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # v2.3.0 (stable)
        env:
          SVN_USERNAME: ${{ steps.svn-creds.outputs.svn_username }}
          SVN_PASSWORD: ${{ steps.svn-creds.outputs.svn_password }}
          SLUG: keel-defaults
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_DIR: build/keel-defaults
          ASSETS_DIR: build/wporg-assets
        with:
          # Unset on a workflow_call, so a real release is never a rehearsal.
          dry-run: ${{ inputs.dry_run || false }}

      # A failure here is not a failed release — it is half a released one, and
      # the difference is invisible from GitHub. release.yml has already tagged,
      # built and published; only wordpress.org is missing, so every signal a
      # maintainer would check says the version shipped. Say the quiet part.
      - name: Explain a deploy failure
        if: failure()
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "::error::wordpress.org was NOT updated. The GitHub Release for ${VERSION} exists and the directory is still on the previous version, so the two now disagree. Re-run this workflow once the cause is fixed; it is idempotent for a version whose tag is not yet in SVN."
          echo "If the failure was 'svn: E215004: Authentication failed', check these before changing anything else:"
          echo "  1. WP_ORG_SVN_USERNAME is the wordpress.org LOGIN — the name in profiles.wordpress.org/<login>/ — not the email and not the GitHub username. The preflight step above warns when it does not match a listed contributor."
          echo "  2. WP_ORG_SVN_PASSWORD is that account's wordpress.org password. It is not an application password and not a GitHub token."
          echo "  3. The account has to be a committer on this plugin, which is separate from being listed as a contributor."
