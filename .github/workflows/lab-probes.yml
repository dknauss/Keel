name: Lab probes

# For risky changes, a separate tester (another agent, ideally another model, or
# a person) commits a probe file to docs/review/probes/ before any code exists,
# and the implementer has to pass probes it never wrote. Without a check, "the
# tester went first" is only a claim.
#
# This fails a pull request whose tester probes landed after the build started,
# carry no "Lab-Role: tester" trailer, or changed after they were written. A pull
# request that touches no probe file passes. See docs/review/probes/README.md.
#
# A second job, "Guardrail changes reviewed", fails a pull request that changes
# the checks themselves (.github/, the checkers, their tests and fixtures, or any
# probe file) until a maintainer adds the "guardrail-reviewed" label by hand
# after reading those diffs. A third, "Maintainer sign-off", fails a pull request
# that anyone other than a maintainer pushed to (the agent machine account
# included) until a maintainer adds the "maintainer-approved" label by hand.
# Both are decided by bin/check-maintainer-signoff from GitHub's own records. With the "tier-3" label, the first job also fails when the
# pull request adds no probe file. The tier itself is a review judgment; the
# gate checks ordering and presence, not whether results were resolved.
#
# Why pull_request_target: with pull_request, the workflow file comes from the
# pull request's own branch, so a branch could edit this file to skip the checker
# and still report a green "Tester probes came first". pull_request_target always
# runs this file, and the checker, as they are on the base branch. The pull
# request's commits are fetched as data and read with git only; nothing from the
# pull request's branch is executed, so the base-branch context is safe here.
#
# The guardrail-reviewed label covers the diff a maintainer read. A later push
# that changes a guardrail file removes the label and fails the job again.
#
# MAINTAINERS lists the accounts whose hand-made labels count. Never add the
# agent machine account. Changing it is itself a guardrail change.
#
# Refs reach the script as arguments from the event payload, never as text from
# the pull request, so nothing a contributor writes becomes shell.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

env:
  MAINTAINERS: dknauss

jobs:
  probes:
    name: Tester probes came first
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base branch (never the pull request's code)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Fetch the pull request's commits as data
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Check the probes predate the build and are unchanged
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: php bin/check-lab-probes "$BASE_SHA" "$HEAD_SHA"

      - name: A tier-3 pull request must carry tester probes
        if: contains(github.event.pull_request.labels.*.name, 'tier-3')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Same checker, same idea of what a probe file is (.md under
        # docs/review/probes/, not a README), so a placeholder can't satisfy it.
        run: php bin/check-lab-probes --require-probe "$BASE_SHA" "$HEAD_SHA"

  guardrails:
    name: Guardrail changes reviewed
    runs-on: ubuntu-latest
    # pull-requests: write only so the checker can take a stale label off. It
    # still runs nothing from the pull request's branch.
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Check out the base branch (never the pull request's code)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Fetch the pull request's commits as data
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          git cat-file -e "${HEAD_SHA}^{commit}"

      # The grading machinery: workflows, the checkers and their own tests and
      # fixtures, and every probe file (added, changed, removed or renamed in or
      # out). Ordinary tests are reviewed at merge like any other code; gating
      # them here would put a label on nearly every pull request.
      #
      # The label counts only if a maintainer added it by hand (not the agent
      # account, and not an agent session acting as the maintainer through a
      # GitHub App), and only for the commit that was on the branch at the
      # time: a later push that changes a guardrail file takes it off. The
      # checker reads all of that from GitHub's records on every run, so it
      # doesn't depend on which event started the run.
      - name: Changes to the checks need a maintainer's label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          MAINTAINERS: ${{ env.MAINTAINERS }}
        run: bash bin/check-maintainer-signoff guardrail

  signoff:
    name: Maintainer sign-off
    runs-on: ubuntu-latest
    # An account other than a maintainer's (the agent machine account, or an
    # outside contributor) pushed to this branch: a maintainer must read the
    # pull request and add the maintainer-approved label by hand, after the
    # last such push. Branches only maintainers pushed to pass without it.
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Check out the base branch (never the pull request's code)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Pushes by anyone else need a maintainer's label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          MAINTAINERS: ${{ env.MAINTAINERS }}
        run: bash bin/check-maintainer-signoff pushes
